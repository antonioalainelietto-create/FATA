<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Associazione FATA – Link Social</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: url("sfondo.jpg") no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      text-align: center;
    }

    .overlay {
      background: rgba(0,0,0,0.55);
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-container {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .logo-container img {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #fff;
    }

    .titolo-principale {
      margin-top: 25px;
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: 3px;
      color: #ffffff;
      text-align: center;
      width: 100%;
    }

    .sottotitolo {
      margin-top: 10px;
      font-size: 1.5rem;
      font-weight: 600;
      color: #ffffff;
      text-align: center;
      width: 100%;
    }

    .descrizione {
      margin-top: 20px;
      font-size: 1.2rem;
      font-weight: 400;
      color: #ffffff;
      padding: 0 20px;
      text-align: center;
      width: 100%;
    }

    .social-row {
      margin-top: 40px;
      display: flex;
      justify-content: center;
      gap: 25px;
      flex-wrap: wrap;
      width: 100%;
    }

    .social-btn img {
      width: 60px;
      height: 60px;
      border-radius: 12px;
      object-fit: cover;
      transition: transform 0.2s ease;
    }

    .social-btn img:hover {
      transform: scale(1.1);
    }

    .email-block {
      margin-top: 40px;
      font-size: 1rem;
      width: 100%;
      text-align: center;
    }

    .email-block a {
      color: #fff;
      text-decoration: underline;
      font-weight: 600;
    }

    .presidente-block {
      margin-top: 45px;
      width: 100%;
      text-align: center;
    }

    .presidente-photo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid #fff;
      margin: 0 auto 10px auto;
    }

    .presidente-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .presidente-name {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .footer {
      margin-top: 40px;
      font-size: 0.8rem;
      opacity: 0.8;
      width: 100%;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="overlay">

    <div class="logo-container">
      <img src="logo.jpg" alt="Logo Associazione">
    </div>

    <div class="titolo-principale">F.A.T.A.</div>

    <div class="sottotitolo">Famiglie Associate per la Tutela dell’Ascolto</div>

    <div id="descrizione" class="descrizione"></div>

    <!-- SOCIAL -->
    <div class="social-row">
      <a class="social-btn" href="https://www.facebook.com/share/1EJJibkDWm/?mibextid=wwXIfr" target="_blank">
        <img src="facebook.png" alt="Facebook">
      </a>

      <a class="social-btn" href="https://www.instagram.com/fata_famiglieascolto?xtok=Zzdham5rdTJlajNk" target="_blank">
        <img src="instagram.png" alt="Instagram">
      </a>
    </div>

    <div class="email-block">
      Per altre informazioni scrivici:
      <a href="mailto:fataassociazione@gmail.com">fataassociazione@gmail.com</a>
    </div>

    <div class="presidente-block">
      <div class="presidente-photo">
        <img src="presidente.jpg" alt="Presidente">
      </div>
      <div class="presidente-name">Presidente: Claudia Albano</div>
    </div>

    <div class="footer">
      © 2026 Associazione FATA
    </div>

  </div>

  <script>
    fetch("descrizione.txt")
      .then(response => response.text())
      .then(text => {
        document.getElementById("descrizione").textContent = text;
      })
      .catch(error => {
        document.getElementById("descrizione").textContent = "Errore nel caricamento della descrizione.";
      });
  </script>

</body>
</html>
