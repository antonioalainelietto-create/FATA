<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Associazione FATA – Link Social</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: url("sfondo.jpg") no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      text-align: center;
    }

    .overlay {
      background: rgba(0,0,0,0.55);
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    /* LOGO */
    .logo-container {
      margin-top: 30px;
    }

    .logo-container img {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #fff;
    }

    .descrizione {
      margin-top: 15px;
      font-size: 1.2rem;
      font-weight: 600;
      padding: 0 20px;
    }

    /* WHATSAPP */
    .whatsapp-block {
      margin-top: 30px;
    }

    .whatsapp-block img {
      width: 80px;
    }

    .whatsapp-block a {
      display: block;
      margin-top: 10px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      text-decoration: underline;
    }

    /* SOCIAL BUTTONS */
    .social-row {
      margin-top: 40px;
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .social-btn img {
      width: 60px;
      height: 60px;
      border-radius: 12px;
      object-fit: cover;
      transition: transform 0.2s ease;
    }

    .social-btn img:hover {
      transform: scale(1.1);
    }

    /* EMAIL */
    .email-block {
      margin-top: 40px;
      font-size: 1rem;
    }

    .email-block a {
      color: #fff;
      text-decoration: underline;
      font-weight: 600;
    }

    /* PRESIDENTE */
    .presidente-block {
      margin-top: 40px;
    }

    .presidente-photo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid #fff;
      margin: 0 auto 10px auto;
    }

    .presidente-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .presidente-name {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .footer {
      margin-top: 40px;
      font-size: 0.8rem;
      opacity: 0.8;
    }
  </style>
</head>

<body>
  <div class="overlay">

    <!-- LOGO -->
    <div class="logo-container">
      <img src="logo.jpg" alt="Logo Associazione">
    </div>

    <!-- DESCRIZIONE -->
    <div class="descrizione">
      Associazione FATA – Famiglie Ascolto e Tutela Attiva
    </div>

    <!-- WHATSAPP -->
    <div class="whatsapp-block">
      <img src="whatsapp.png" alt="WhatsApp">
      <a href="https://chat.whatsapp.com/FlbQUYjMrFuIRXIP0mPZmX?s=cl&p=i&mlu=4&ilr=4" target="_blank">
        Clicca per entrare nel gruppo WhatsApp
      </a>
    </div>

    <!-- SOCIAL -->
    <div class="social-row">
      <a class="social-btn" href="https://www.facebook.com/share/1EJJibkDWm/?mibextid=wwXIfr" target="_blank">
        <img src="facebook.png" alt="Facebook">
      </a>

      <a class="social-btn" href="https://www.instagram.com/fata_famiglieascolto?xtok=Zzdham5rdTJlajNk" target="_blank">
        <img src="instagram.png" alt="Instagram">
      </a>
    </div>

    <!-- EMAIL -->
    <div class="email-block">
      Per altre informazioni scrivici:  
      <a href="mailto:fataassociazione@gmail.com">fataassociazione@gmail.com</a>
    </div>

    <!-- PRESIDENTE -->
    <div class="presidente-block">
      <div class="presidente-photo">
        <img src="presidente.jpg" alt="Presidente">
      </div>
      <div class="presidente-name">Presidente: Claudia Albano</div>
    </div>

    <div class="footer">
      © 2026 Associazione FATA
    </div>

  </div>
</body>
</html>
